name: Flutter CI

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, mpwindows-crm-mvp]
  pull_request:
    branches: [main, mpwindows-crm-mvp]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  ios-build:
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=ios .
      - run: flutter pub get
      - name: Configure native iOS notifications and WidgetKit
        run: |
          ruby -e "require 'xcodeproj'" || gem install xcodeproj --no-document
          ruby native/ios/setup_native.rb
      - name: Configure iOS app
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MPWindows CRM" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'MPWindows CRM cần truy cập thư viện ảnh để lưu hình ảnh công trình.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'MPWindows CRM cần truy cập thư viện ảnh để lưu hình ảnh công trình.'" ios/Runner/Info.plist
      - name: Install official MP Windows app icon
        run: |
          mkdir -p /tmp/mpwindows-icon
          qlmanage -t -s 1024 -o /tmp/mpwindows-icon assets/branding/mpwindows_app_icon.svg >/dev/null 2>&1
          SOURCE="/tmp/mpwindows-icon/mpwindows_app_icon.svg.png"
          test -f "$SOURCE"
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          icon_set = pathlib.Path("ios/Runner/Assets.xcassets/AppIcon.appiconset")
          contents = json.loads((icon_set / "Contents.json").read_text())
          source = pathlib.Path("/tmp/mpwindows-icon/mpwindows_app_icon.svg.png")
          for image in contents.get("images", []):
              filename, size, scale = image.get("filename"), image.get("size"), image.get("scale")
              if not filename or not size or not scale:
                  continue
              pixels = str(round(float(size.split("x")[0]) * float(scale.rstrip("x"))))
              subprocess.run(["sips", "-s", "format", "png", "-z", pixels, pixels, str(source), "--out", str(icon_set / filename)], check=True, stdout=subprocess.DEVNULL)
          PY
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/unsigned_ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned_ipa/Payload/
          cd build/unsigned_ipa
          zip -qry MPWindowsCRM-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MPWindowsCRM-iOS-unsigned
          path: build/unsigned_ipa/MPWindowsCRM-unsigned.ipa
          if-no-files-found: error
