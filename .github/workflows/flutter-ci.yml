name: Flutter CI

on:
  push:
    branches: [main, mpwindows-crm-mvp]
  pull_request:
    branches: [main, mpwindows-crm-mvp]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios-build:
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=ios .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
