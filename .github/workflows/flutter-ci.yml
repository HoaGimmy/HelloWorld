name: Flutter CI

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, mpwindows-crm-mvp]
  pull_request:
    branches: [main, mpwindows-crm-mvp]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  ios-build:
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=ios .
      - run: flutter pub get
      - name: Configure native iOS notifications and WidgetKit
        run: |
          ruby -e "require 'xcodeproj'" || gem install xcodeproj --no-document
          ruby native/ios/setup_native.rb
      - name: Configure iOS app
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MPWindows CRM" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'MPWindows CRM cần truy cập thư viện ảnh để lưu hình ảnh công trình.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'MPWindows CRM cần truy cập thư viện ảnh để lưu hình ảnh công trình.'" ios/Runner/Info.plist
      - name: Install official MP Windows app icon
        run: |
          base64 -D -i assets/branding/mpwindows_app_icon.jpg.b64 -o /tmp/mpwindows_app_icon.jpg
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          icon_set = pathlib.Path("ios/Runner/Assets.xcassets/AppIcon.appiconset")
          contents = json.loads((icon_set / "Contents.json").read_text())
          source = "/tmp/mpwindows_app_icon.jpg"

          for image in contents.get("images", []):
              filename = image.get("filename")
              size = image.get("size")
              scale = image.get("scale")
              if not filename or not size or not scale:
                  continue
              points = float(size.split("x")[0])
              factor = float(scale.rstrip("x"))
              pixels = str(round(points * factor))
              subprocess.run(
                  ["sips", "-s", "format", "png", "-z", pixels, pixels, source, "--out", str(icon_set / filename)],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
          PY
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/unsigned_ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned_ipa/Payload/
          cd build/unsigned_ipa
          zip -qry MPWindowsCRM-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MPWindowsCRM-iOS-unsigned
          path: build/unsigned_ipa/MPWindowsCRM-unsigned.ipa
          if-no-files-found: error
