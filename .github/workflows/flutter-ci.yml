name: Flutter CI

on:
  push:
    branches: [main, mpwindows-crm-mvp]
  pull_request:
    branches: [main, mpwindows-crm-mvp]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  ios-build:
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=ios .
      - run: flutter pub get
      - name: Set iOS display name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MPWindows CRM" ios/Runner/Info.plist || true
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/unsigned_ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned_ipa/Payload/
          cd build/unsigned_ipa
          zip -qry MPWindowsCRM-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MPWindowsCRM-iOS-unsigned
          path: build/unsigned_ipa/MPWindowsCRM-unsigned.ipa
          if-no-files-found: error
