name: mpwindows_crm
description: MPWindows CRM MVP
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.38.0"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mpwindows_logo.svg
    - assets/branding/mpwindows_logo_dark.svg

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  intl: ^0.20.3
  excel: ^4.0.6
  share_plus: ^13.3.1
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
